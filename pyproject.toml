[project]
name = "proxy-tester"
version = "3.0.4"
description = "代理节点批量体检工具: 检测出口地区 / Google / Gemini 可用性, 并导出可用节点 URI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["proxy", "vless", "vmess", "hysteria2", "gemini", "sing-box", "xray"]
dependencies = [
    "fastapi>=0.143.0",
    "httpx[socks]>=0.28.1",
    "uvicorn>=0.54.0",
    # 单节点手工验证脚本 test_google.py 用到; 保留以免破坏它
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/dogflydream/pick-node"
Repository = "https://github.com/dogflydream/pick-node"

# 两个入口:
#   proxy-tester       命令行批量检测
#   proxy-tester-web   Web 面板 (推荐新用户)
[project.scripts]
proxy-tester = "main:main"
proxy-tester-web = "web.server:main"

# 声明构建后端, 否则 uv 会把它当"非打包项目",
# 从而跳过 entry points (实测会遇到 'Skipping installation of entry points' 警告,
# 且 `uv run proxy-tester` 不可用). 用 setuptools 让它成为可安装包.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "web*", "tools*"]
